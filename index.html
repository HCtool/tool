<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool</title>
<!-- Upgraded to xlsx-js-style to support automatic text wrapping and styling in Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>
<style>
  /* --- THEME VARIABLES --- */
  :root {
    /* Simple Light Mode (Default) */
    --text-main: #4c4f69;
    --text-muted: #8c8fa1;
    
    --accent: #1e66f5;
    --accent-transparent: rgba(30, 102, 245, 0.1);
    --danger: #d20f39;
    --warning: #df8e1d;
    --success: #16a34a; 
    
    --glass-bg: #ffffff;
    --glass-border: #ccd0da;
    --glass-shadow: 0 8px 24px rgba(76, 79, 105, 0.08);
    
    --fill-color: #e6e9ef;
    --fill-color-hover: #dce0e8;
    
    --input-bg: var(--fill-color);
    --input-border: var(--glass-border);
    --btn-bg: var(--fill-color);
    --header-bg: #ffffff;
    --hover-filter: brightness(0.95);
    
    --bg-color: #eff1f5;
    --bg-image: none;

    /* Primary Action Button Colors - Light */
    --btn-email-bg: #0284c7; /* Sky Blue */
    --btn-email-text: #ffffff;
    --btn-doc-bg: #7c3aed;   /* Violet */
    --btn-doc-text: #ffffff;
    --btn-add-bg: #ea580c;   /* Orange */
    --btn-add-text: #ffffff;
    --btn-view-bg: #475569;  /* Slate Gray */
    --btn-view-text: #ffffff;

    /* Squarer modern look */
    --radius-sm: 6px; 
    --radius-md: 10px;
    --radius-lg: 16px;
    --border-width: 1px;

    --toast-bg: #4c4f69;
    --toast-text: #eff1f5;
  }

  /* Simple Dark Mode */
  body[data-theme="simple-dark"] {
    --text-main: #e4e4e7;
    --text-muted: #a1a1aa;
    
    --accent: #60a5fa;
    --accent-transparent: rgba(96, 165, 250, 0.15);
    --danger: #f87171;
    --warning: #fb923c;
    --success: #86efac;
    
    --glass-bg: #27272a;
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    
    --fill-color: rgba(255, 255, 255, 0.05);
    --fill-color-hover: rgba(255, 255, 255, 0.1);
    
    --input-bg: var(--fill-color);
    --input-border: var(--glass-border);
    --btn-bg: var(--fill-color);
    --header-bg: #1f1f22;
    --hover-filter: brightness(1.1);
    
    --bg-color: #18181b;
    --bg-image: none;

    /* Primary Action Button Colors - Dark */
    --btn-email-bg: #38bdf8; /* Light Sky Blue */
    --btn-email-text: #000000;
    --btn-doc-bg: #a78bfa;   /* Light Violet */
    --btn-doc-text: #000000;
    --btn-add-bg: #fb923c;   /* Light Orange */
    --btn-add-text: #000000;
    --btn-view-bg: #94a3b8;  /* Light Slate */
    --btn-view-text: #000000;

    --toast-bg: #e4e4e7;
    --toast-text: #18181b;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    background-image: var(--bg-image);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 40px 20px; 
    transition: background-color 0.5s ease, background-image 0.5s ease, color 0.3s ease;
    -webkit-font-smoothing: antialiased;
  }

  /* Core Glass Panel */
  .pt-card {
    background: var(--glass-bg);
    backdrop-filter: blur(25px) saturate(200%);
    -webkit-backdrop-filter: blur(25px) saturate(200%);
    border: var(--border-width) solid var(--glass-border);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 680px;
    box-shadow: var(--glass-shadow);
    position: relative;
    transition: all 0.3s ease;
  }

  /* --- Header Layout --- */
  .pt-header {
    background: var(--header-bg);
    border-bottom: var(--border-width) solid var(--glass-border);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    transition: all 0.3s ease;
  }

  .pt-header-left { 
    display: flex; 
    align-items: center; 
    gap: 14px;
    flex: 1;
  }

  .pt-header-right { 
    display: flex; 
    gap: 6px; 
    align-items: center; 
    justify-content: flex-end;
    flex: 1;
  }

  .pt-btn-newcode, .pt-btn-help, .pt-btn-icon, .pt-btn-clear {
    background: var(--btn-bg); 
    border: none;
    color: var(--text-main); 
    border-radius: var(--radius-sm); 
    padding: 8px 12px; 
    font-size: 13px; 
    font-weight: 600;
    cursor: pointer; 
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); 
    font-family: inherit;
    white-space: nowrap;
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
  }
  
  /* Clear Button Override */
  .pt-btn-clear {
    color: var(--danger);
  }
  
  /* Modern Squarer Icon Buttons */
  .pt-btn-icon {
    width: 36px; height: 36px; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  
  #tabCycler {
    color: var(--accent);
    background: var(--input-bg);
    border: var(--border-width) solid var(--glass-border);
    width: 40px; 
    height: 40px; 
  }
  
  .pt-btn-help {
    width: 32px; height: 32px; padding: 0;
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }

  .pt-btn-newcode:hover, .pt-btn-icon:hover, .pt-btn-help:hover { 
    background: var(--fill-color-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }
  
  .pt-btn-clear:hover {
    background: var(--danger);
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }
  
  .pt-btn-icon:active, .pt-btn-clear:active { transform: translateY(0); }
  .pt-btn-newcode.active { background: var(--warning); color: #fff; box-shadow: none; }
  body[data-theme="simple-dark"] .pt-btn-newcode.active { color: #000; }

  /* Modals Overlay */
  .pt-modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4);
    z-index: 1000; align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .pt-modal-overlay.open { display: flex; animation: pt-fade 0.2s ease; }
  @keyframes pt-fade { from { opacity: 0; } to { opacity: 1; } }
  
  .pt-help-modal {
    background: var(--glass-bg); backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%); 
    border: var(--border-width) solid var(--glass-border);
    border-radius: var(--radius-lg); max-width: 420px; width: 100%;
    overflow: hidden; box-shadow: var(--glass-shadow);
    position: relative;
  }
  .pt-help-modal img { width: 100%; display: block; }
  .pt-help-close {
    position: absolute; top: 12px; right: 12px; width: 32px; height: 32px;
    border-radius: var(--radius-sm); border: none; background: rgba(0,0,0,0.5); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .pt-help-close:hover { background: rgba(0,0,0,0.7); transform: scale(1.05); }

  /* Tracker Modal Specifics */
  .pt-tracker-modal {
    background: var(--glass-bg); backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%);
    border: var(--border-width) solid var(--glass-border);
    border-radius: var(--radius-lg); max-width: 700px; width: 100%; max-height: 85vh;
    display: flex; flex-direction: column;
    box-shadow: var(--glass-shadow); overflow: hidden;
  }
  .pt-tracker-header {
    padding: 16px 20px; border-bottom: var(--border-width) solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; background: var(--header-bg); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  }
  .pt-tracker-header h3 { font-size: 16px; margin: 0; color: var(--text-main); }
  .pt-tracker-header div { display: flex; gap: 8px; }
  .pt-tracker-header button {
    background: var(--btn-bg); border: none; padding: 6px 12px; border-radius: var(--radius-sm); color: var(--text-main); font-weight: 600; cursor: pointer; font-size: 13px; transition: all 0.2s;
  }
  .pt-tracker-header button.pt-btn-excel { background: var(--success); color: #fff; }
  .pt-tracker-header button.pt-btn-delall { background: var(--danger); color: #fff; }
  
  body[data-theme="simple-dark"] .pt-tracker-header button.pt-btn-excel { color: #000; }
  
  .pt-tracker-header button:hover { transform: translateY(-1px); filter: brightness(1.1); }
  .pt-tracker-body {
    padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
  }
  .pt-tracker-item {
    background: var(--input-bg); border: var(--border-width) solid var(--input-border); border-radius: var(--radius-md); padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .pt-ti-header { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .pt-ti-date, .pt-ti-codes {
    background: transparent; border: var(--border-width) solid var(--glass-border); border-radius: var(--radius-sm); padding: 6px; color: var(--text-main); font-size: 13px; font-family: inherit; transition: all 0.2s;
  }
  .pt-ti-date:focus, .pt-ti-codes:focus, .pt-ti-doc:focus { outline: 1px solid var(--accent); background: var(--input-bg); }
  .pt-ti-date { width: 60px; text-align: center; }
  .pt-ti-codes { flex: 1; min-width: 120px; }
  .pt-ti-doc {
    width: 100%; min-height: 80px; padding: 8px; border: var(--border-width) solid var(--glass-border); border-radius: var(--radius-sm); background: transparent; color: var(--text-main); font-size: 13px; font-family: inherit; resize: vertical; line-height: 1.4; transition: all 0.2s;
  }
  .pt-ti-actions { display: flex; gap: 8px; margin-left: auto; }
  .pt-ti-actions button {
    background: var(--btn-bg); border: none; padding: 6px 10px; border-radius: var(--radius-sm); color: var(--text-main); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .pt-ti-actions button:hover { background: var(--fill-color-hover); transform: translateY(-1px); }
  .pt-ti-actions button.del-btn { color: var(--danger); }
  .pt-ti-actions button.save-btn { color: var(--accent); }

  /* Body & Layout */
  .pt-body { padding: 24px 24px 28px; }
  .pt-section-label {
    font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); margin: 24px 0 10px; padding-left: 4px; transition: color 0.3s;
  }
  .pt-section-label:first-child { margin-top: 0; }

  /* Inputs & Rows */
  .pt-row {
    margin-bottom: 1px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
    background: var(--input-bg); padding: 8px 16px; border: var(--border-width) solid var(--input-border); 
    transition: all 0.3s;
  }
  
  .pt-row:first-of-type { border-radius: var(--radius-sm) var(--radius-sm) 0 0; border-bottom: none; }
  .pt-row:nth-of-type(2) { border-radius: 0; border-bottom: none; }
  .pt-row:nth-of-type(3) { border-radius: 0 0 var(--radius-sm) var(--radius-sm); margin-bottom: 16px; }
  
  .pt-label { font-size: 15px; font-weight: 500; color: var(--text-main); white-space: nowrap; width: 160px; transition: color 0.3s; }
  
  .pt-input {
    padding: 8px 12px; border: none; border-radius: var(--radius-sm); flex: 1; min-width: 80px;
    outline: none; font-size: 14px; font-weight: 500; font-family: inherit; 
    background: transparent; color: var(--text-main);
    text-transform: uppercase; transition: all 0.3s ease; text-align: right;
  }
  .pt-input::placeholder { text-transform: none; color: var(--text-muted); font-weight: 400; }
  
  /* Standalone Inputs */
  .pt-input-standalone {
    background: var(--input-bg); border: var(--border-width) solid var(--input-border); 
    border-radius: var(--radius-sm); padding: 12px 14px; text-align: left;
  }

  /* Date Picker */
  .pt-date-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding: 12px 16px;
    background: var(--input-bg); border: var(--border-width) solid var(--input-border); border-radius: var(--radius-sm);
    position: relative; transition: all 0.3s; justify-content: space-between;
  }

  .pt-date-label {
    font-size: 15px; font-weight: 500; color: var(--text-main); white-space: nowrap;
    cursor: pointer; user-select: none; transition: color 0.2s;
    display: flex; align-items: center; gap: 8px;
  }
  .pt-date-input {
    width: 120px; padding: 8px 12px; border: none; border-radius: var(--radius-sm);
    outline: none; font-size: 15px; font-weight: 500; font-family: inherit; 
    background: var(--btn-bg); color: var(--accent); text-align: center;
    transition: all 0.3s ease; cursor: pointer;
  }

  /* Calendar Popup */
  .pt-cal-popup {
    display: none; position: absolute; top: calc(100% + 8px); right: 0; z-index: 999;
    background: var(--glass-bg); backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%);
    border: var(--border-width) solid var(--glass-border); border-radius: var(--radius-md);
    box-shadow: var(--glass-shadow); padding: 16px; min-width: 280px; transition: all 0.3s;
  }
  .pt-cal-popup.open { display: block; animation: pt-scaleUp 0.2s cubic-bezier(0.16, 1, 0.3, 1); transform-origin: top right; }
  @keyframes pt-scaleUp { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  
  .pt-cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .pt-cal-nav button {
    background: var(--btn-bg); border: none; border-radius: var(--radius-sm); cursor: pointer;
    font-size: 16px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    color: var(--accent); transition: all 0.2s ease; font-weight: bold;
  }
  .pt-cal-nav button:hover { background: var(--fill-color-hover); }
  .pt-cal-month { font-size: 15px; font-weight: 600; color: var(--text-main); transition: color 0.3s; }
  .pt-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .pt-cal-dow { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 4px 0; transition: color 0.3s; }
  
  .pt-cal-day {
    text-align: center; font-size: 15px; font-weight: 500; padding: 8px 2px; border-radius: var(--radius-sm);
    cursor: pointer; color: var(--text-main); transition: all 0.2s ease;
  }
  .pt-cal-day:hover { background: var(--btn-bg); color: var(--accent); }
  .pt-cal-day.today { font-weight: 600; color: var(--accent); background: var(--accent-transparent); }
  .pt-cal-day.selected { background: var(--accent); color: #fff; font-weight: 600; }
  .pt-cal-day.empty { cursor: default; background: none; }

  /* Confirmation Alert Button */
  #pt-confirm {
    width: 100%; margin: 16px 0; padding: 10px 14px; 
    background: var(--input-bg); border: var(--border-width) solid var(--input-border); border-radius: var(--radius-sm); 
    cursor: pointer; font-size: 13px; font-weight: 600; color: var(--danger); font-family: inherit; text-align: left;
    transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  #pt-confirm.active { background: var(--success); color: #fff; border-color: transparent; }
  body[data-theme="simple-dark"] #pt-confirm.active { color: #000; }

  /* Pills General */
  .pt-pills-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }

  /* Modern Square Pills */
  .pt-work-pill, .pt-req-pill {
    padding: 8px 14px; border-radius: var(--radius-sm); border: none; 
    background: var(--btn-bg); color: var(--text-main); font-size: 13px; font-weight: 600; 
    cursor: pointer; transition: all 0.2s ease; font-family: inherit;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  
  .pt-work-pill:hover, .pt-req-pill:hover {
    background: var(--fill-color-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }
  
  .pt-work-pill.active { background: var(--accent); color: #fff; box-shadow: none; }
  .pt-req-pill.selected { background: var(--warning); color: #fff; box-shadow: none; }
  body[data-theme="simple-dark"] .pt-req-pill.selected { color: #000; }

  /* Main Action Buttons (Unified Alignment & Behavior) */
  .pt-btn-container { display: flex; gap: 12px; margin-top: 24px; }
  .pt-btn-action {
    flex: 1; padding: 10px 12px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
    font-weight: 600; font-family: inherit; transition: all 0.2s ease; display: flex;
    align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .pt-btn-action:hover { transform: translateY(-1px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); filter: brightness(1.05); }
  .pt-btn-action:active { transform: translateY(0); }
  
  .pt-btn-subject { background: var(--accent); color: #fff; width: 100%; margin-bottom: 24px; }
  body[data-theme="simple-dark"] .pt-btn-subject { color: #000; }
  
  .pt-btn-email { background: var(--btn-email-bg); color: var(--btn-email-text); }
  .pt-btn-doc { background: var(--btn-doc-bg); color: var(--btn-doc-text); }
  .pt-btn-add { background: var(--btn-add-bg); color: var(--btn-add-text); }
  .pt-btn-view { background: var(--btn-view-bg); color: var(--btn-view-text); }

  /* Review Button */
  .pt-review-btn {
    width: 100%; margin: 8px 0 0; padding: 10px 12px; background: var(--btn-bg);
    border: none; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
    font-weight: 600; color: var(--accent); font-family: inherit; display: flex;
    align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease;
  }
  .pt-review-btn:hover { background: var(--fill-color-hover); transform: translateY(-1px); }
  .pt-review-btn.flash { background: var(--success); color: #fff; }
  body[data-theme="simple-dark"] .pt-review-btn.flash { color: #000; }

  /* Dividers & Notes */
  .pt-divider { height: 1px; background: var(--glass-border); margin: 24px 0; border-radius: 2px; }
  
  #pt-notes { 
    width: 100%; min-height: 120px; padding: 14px; border: var(--border-width) solid var(--input-border); border-radius: var(--radius-sm); 
    font-size: 14px; font-weight: 400; font-family: inherit; color: var(--text-main); background: var(--input-bg); 
    resize: vertical; outline: none; transition: all 0.3s ease; line-height: 1.5; 
  }
  #pt-notes:focus { background: var(--fill-color-hover); box-shadow: 0 0 0 2px var(--accent); }
  #pt-notes::placeholder { color: var(--text-muted); font-weight: 400; }

  /* Template Tab Specifics */
  #tab3-view {
    display: none;
    flex-direction: column;
    height: 60vh;
    min-height: 350px;
  }
  
  #pt-template-text {
    width: 100%; flex: 1; padding: 14px; border: var(--border-width) solid var(--input-border);
    border-radius: var(--radius-sm); font-size: 14px; font-family: inherit;
    color: var(--text-main); background: var(--input-bg); resize: none;
    outline: none; transition: all 0.3s ease; line-height: 1.5;
  }
  #pt-template-text:focus { background: var(--fill-color-hover); box-shadow: 0 0 0 2px var(--accent); }
  #pt-template-text::placeholder { color: var(--text-muted); font-weight: 400; }

  .pt-footer { padding: 16px 24px 24px; text-align: center; font-size: 13px; color: var(--text-muted); font-weight: 600; border-top: var(--border-width) solid var(--glass-border); background: transparent; transition: all 0.3s;}

  /* --- Notification Toast --- */
  .pt-toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(20px) scale(0.9);
    background: var(--toast-bg);
    backdrop-filter: blur(20px) saturate(200%);
    -webkit-backdrop-filter: blur(20px) saturate(200%);
    color: var(--toast-text);
    padding: 12px 24px;
    border-radius: 999px;
    font-size: 14px; 
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 2000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pt-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
</style>
</head>
<body data-theme="simple-light">

<div class="pt-card">
  <div class="pt-header">
    
    <!-- LEFT SIDE: TAB SCROLLER (Cycle Button) -->
    <div class="pt-header-left">
      <button class="pt-btn-icon" id="tabCycler" onclick="ptCycleTab()" aria-label="Cycle Tabs" title="Switch Tab">
        <svg id="tabIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
    </div>

    <!-- RIGHT SIDE: Actions & Theme -->
    <div class="pt-header-right">
      <button id="pt-newcode" class="pt-btn-newcode" onclick="ptToggleNewCode()">New Code</button>
      
      <!-- NEW CLEAR BUTTON -->
      <button class="pt-btn-clear" onclick="ptClear(false)">Clear</button>

      <!-- THEME ROLLER BUTTON -->
      <button class="pt-btn-icon" id="themeRoller" aria-label="Cycle Theme" title="Switch Theme">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
      
      <button class="pt-btn-help" onclick="ptOpenHelp()" title="Help">?</button>
    </div>
    
  </div>

  <div class="pt-body">
    <!-- TABS 1 & 2 SHARED FORM -->
    <div id="tab12-view">
      <div class="pt-section-label">Agent Info</div>
      <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
        <input class="pt-input pt-input-standalone" autocomplete="off" id="pt-name" placeholder="Name" style="flex:2;min-width:120px;">
        <input class="pt-input pt-input-standalone" autocomplete="off" id="pt-soli" placeholder="Soli" style="flex:1;min-width:70px;">
        <input class="pt-input pt-input-standalone" autocomplete="off" id="pt-wc" placeholder="WC" style="flex:1;min-width:70px;">
        <input class="pt-input pt-input-standalone" autocomplete="off" id="pt-rc" placeholder="RC" style="flex:1;min-width:70px;">
      </div>
      
      <!-- Tab 1 Specific Subject Button -->
      <button class="pt-btn-action pt-btn-subject" id="pt-subject-btn" onclick="ptCopySubject()">Copy Email Subject</button>

      <div class="pt-section-label">Request Details</div>
      <div>
        <div class="pt-row"><span class="pt-label">Contract level to</span><input class="pt-input" autocomplete="off" id="pt-t1" placeholder="Enter value"></div>
        <div class="pt-row"><span class="pt-label">Comm schedule to</span><input class="pt-input" autocomplete="off" id="pt-t2" placeholder="Enter value"></div>
        <div class="pt-row"><span class="pt-label">Direct upline to</span><input class="pt-input" autocomplete="off" id="pt-t3" placeholder="Enter value"></div>
      </div>

      <div class="pt-date-row" id="pt-date-row">
        <span class="pt-date-label" onclick="ptToggleCal()" title="Open calendar">
          Effective Date
        </span>
        <input class="pt-date-input" autocomplete="off" id="pt-date" placeholder="MM/DD/YYYY" oninput="ptFormatDate(this)" maxlength="10" onclick="ptToggleCal()">
        
        <div class="pt-cal-popup" id="pt-cal-popup">
          <div class="pt-cal-nav">
            <button onclick="ptCalNav(-1)">&#8249;</button>
            <span class="pt-cal-month" id="pt-cal-month"></span>
            <button onclick="ptCalNav(1)">&#8250;</button>
          </div>
          <div class="pt-cal-grid" id="pt-cal-grid"></div>
        </div>
      </div>

      <button id="pt-confirm" class="active" onclick="this.classList.toggle('active')">
        Sent Confirmation Email (Burned as Source)
      </button>

      <div class="pt-section-label">Work Objects</div>
      <div class="pt-pills-wrap">
        <button class="pt-work-pill" id="pt-w1" onclick="this.classList.toggle('active')">ADDCHNGE</button>
        <button class="pt-work-pill" id="pt-w4" onclick="this.classList.toggle('active')">ANNUALZ</button>
        <button class="pt-work-pill" id="pt-w3" onclick="this.classList.toggle('active')">EFT</button>
        <button class="pt-work-pill" id="pt-w2" onclick="this.classList.toggle('active')">SIMCHANGE</button>
        <button class="pt-work-pill" id="pt-w5" onclick="this.classList.toggle('active')">ASSGNMENT</button>
      </div>
      
      <div class="pt-date-row" style="margin-bottom: 8px;">
          <span class="pt-label" style="width: auto; font-size:14px;">LCHTERM</span>
          <input class="pt-input" autocomplete="off" id="pt-lch" placeholder="Enter details" style="text-align: right; background: transparent; padding: 0;">
      </div>

      <!-- Main Action Buttons (Switched based on Tabs) -->
      
      <!-- Tab 1 Actions -->
      <div class="pt-btn-container" id="tab1-actions">
        <button class="pt-btn-action pt-btn-email" id="pt-email-btn" onclick="ptCopyEmail()">Copy Email Body</button>
        <button class="pt-btn-action pt-btn-doc" id="pt-doc-btn" onclick="ptCopyDoc('pt-doc-btn', 'Copy Documentation')">Copy Documentation</button>
      </div>

      <!-- Tab 2 Actions -->
      <div class="pt-btn-container" id="tab2-actions" style="display:none;">
        <button class="pt-btn-action pt-btn-email" id="pt-email-outlook-btn" onclick="ptEmailOutlook()">Email</button>
        <button class="pt-btn-action pt-btn-doc" id="pt-doc-outlook-btn" onclick="ptCopyDoc('pt-doc-outlook-btn', 'Documentation')">Documentation</button>
      </div>

      <!-- SHARED TRACKER ROW: Unified for both Tab 1 and Tab 2 -->
      <div class="pt-btn-container" id="shared-tracker-actions" style="margin-top: 12px;">
        <button class="pt-btn-action pt-btn-add" onclick="ptAddToTracker()">Add to Tracker</button>
        <button class="pt-btn-action pt-btn-view" onclick="ptOpenTracker()">Tracker</button>
      </div>

      <div class="pt-divider"></div>

      <div>
        <div class="pt-section-label">Outstanding Requirements</div>
        <div class="pt-pills-wrap">
          <button class="pt-req-pill" onclick="ptHandlePill('incorrect_signer', this)">Incorrect Signer</button>
          <button class="pt-req-pill" onclick="ptHandlePill('unable_to_process', this)">Unable2Process</button>
          <button class="pt-req-pill" onclick="ptHandlePill('submit_a_form', this)">Old Verified</button>
          <button class="pt-req-pill" onclick="ptHandlePill('out', this)">New Verified</button>
          <button class="pt-req-pill" onclick="ptHandlePill('standing', this)">LCHTERM</button>
        </div>
        <button id="pt-review" class="pt-review-btn" onclick="ptReviewFlash()">
          Please review
        </button>
      </div>

      <div class="pt-section-label">Notes</div>
      <textarea id="pt-notes" placeholder="Type additional notes here..."></textarea>
    </div>

    <!-- TAB 3 VIEW: EMAIL TEMPLATE -->
    <div id="tab3-view">
      <textarea id="pt-template-text" placeholder="Type or paste your Outlook email template here..."></textarea>
    </div>

  </div>

</div>

<!-- Help Modal -->
<div class="pt-modal-overlay" id="pt-help-overlay" onclick="if(event.target===this) ptCloseHelp()">
  <div class="pt-help-modal">
    <button class="pt-help-close" onclick="ptCloseHelp()">✕</button>
    <img id="pt-help-img" src="" alt="Help">
  </div>
</div>

<!-- Tracker Modal -->
<div class="pt-modal-overlay" id="pt-tracker-overlay" onclick="if(event.target===this) ptCloseTracker()">
  <div class="pt-tracker-modal">
    <div class="pt-tracker-header">
      <h3>Processed Tracker</h3>
      <div>
        <button class="pt-btn-delall" onclick="ptDeleteAllTracker()">Delete All</button>
        <button class="pt-btn-excel" onclick="ptDownloadExcel()">Download Excel</button>
        <button onclick="ptCloseTracker()">✕</button>
      </div>
    </div>
    <div class="pt-tracker-body" id="pt-tracker-body">
      <!-- Tracker items will be rendered here -->
    </div>
  </div>
</div>

<!-- Notification Toast -->
<div class="pt-toast" id="pt-toast">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
  <span id="pt-toastMsg"></span>
</div>

<script>
(function() {
  var calYear, calMonth;
  var now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();

  // ---------- Toast Notification Logic ----------
  let toastTimer;
  const toastEl = document.getElementById('pt-toast');
  const toastMsg = document.getElementById('pt-toastMsg');
  
  function showToast(msg) {
    clearTimeout(toastTimer);
    toastMsg.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  // ---------- Theme Roller Logic ----------
  const themeRoller = document.getElementById('themeRoller');
  const themeIcon = document.getElementById('themeIcon');
  
  const themes = [
    { id: 'simple-light', name: 'Light mode', icon: '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>' },
    { id: 'simple-dark', name: 'Dark mode', icon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>' }
  ];

  let currentThemeIndex = themes.findIndex(t => t.id === (localStorage.getItem('hcAppTheme') || 'simple-light'));
  if (currentThemeIndex === -1) currentThemeIndex = 0;

  function applyTheme(index, notify = false) {
    const theme = themes[index];
    document.body.setAttribute('data-theme', theme.id);
    localStorage.setItem('hcAppTheme', theme.id);
    themeIcon.innerHTML = theme.icon;
    if (notify) { showToast(`${theme.name}`); }
  }
  applyTheme(currentThemeIndex);

  themeRoller.addEventListener('click', () => {
    currentThemeIndex = (currentThemeIndex + 1) % themes.length;
    applyTheme(currentThemeIndex, true);
  });

  // ---------- Tab Cycle Scroller Logic ----------
  const tabIcon = document.getElementById('tabIcon');
  const notesArea = document.getElementById('pt-notes');
  const tabData = [
    { id: 1, name: 'Home', icon: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline>' }, // Home/Main Icon
    { id: 2, name: 'Outlook', icon: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline>' }, // Mail Icon
    { id: 3, name: 'Email Template', icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>' } // Text File Icon
  ];
  let currentTabIdx = 0;

  window.ptCycleTab = function() {
    currentTabIdx = (currentTabIdx + 1) % tabData.length;
    ptSwitchTab(currentTabIdx + 1, true);
  };

  window.ptSwitchTab = function(tabIndex, notify = false) {
    const tab = tabData[tabIndex - 1];
    tabIcon.innerHTML = tab.icon;
    if(notify) { showToast(tab.name); }

    const view12 = document.getElementById('tab12-view');
    const view3 = document.getElementById('tab3-view');
    const subjectBtn = document.getElementById('pt-subject-btn');
    const actions1 = document.getElementById('tab1-actions');
    const actions2 = document.getElementById('tab2-actions');

    if (tabIndex === 1) { // Main
      view12.style.display = 'block';
      view3.style.display = 'none';
      subjectBtn.style.display = 'flex';
      actions1.style.display = 'flex';
      actions2.style.display = 'none';
      notesArea.placeholder = "Type additional notes here...";
    } else if (tabIndex === 2) { // Outlook App User
      view12.style.display = 'block';
      view3.style.display = 'none';
      subjectBtn.style.display = 'none'; // No subject btn here
      actions1.style.display = 'none';
      actions2.style.display = 'flex';
      notesArea.placeholder = "Type additional notes here...";
    } else if (tabIndex === 3) { // Email Template
      view12.style.display = 'none';
      view3.style.display = 'flex';
    }
  };
  
  // Initialize the first tab on load
  ptSwitchTab(1);

  // ---------- Template Autosave Logic ----------
  const templateEl = document.getElementById('pt-template-text');
  templateEl.value = localStorage.getItem('hcEmailTemplate') || '';
  templateEl.addEventListener('input', function() {
    localStorage.setItem('hcEmailTemplate', this.value);
  });

  // ---------- Form Logic ----------
  document.getElementById('pt-soli').addEventListener('input', function() { if (this.value) document.getElementById('pt-wc').value = ''; });
  document.getElementById('pt-wc').addEventListener('input', function() { if (this.value) document.getElementById('pt-soli').value = ''; });

  document.querySelectorAll('.pt-input, .pt-input-standalone').forEach(el => {
    if(el.id !== 'pt-date'){
        el.addEventListener('input', function() {
        const pos = this.selectionStart;
        this.value = this.value.toUpperCase();
        this.setSelectionRange(pos, pos);
        });
        el.addEventListener('blur', function() { this.value = this.value.trim(); });
    }
  });

  document.addEventListener('click', function(e) {
    const popup = document.getElementById('pt-cal-popup');
    const row = document.getElementById('pt-date-row');
    if (!row.contains(e.target)) popup.classList.remove('open');
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      ptCloseHelp();
      ptCloseTracker();
    }
  });

  window.ptOpenHelp = function() { document.getElementById('pt-help-overlay').classList.add('open'); };

  window.ptCloseHelp = function() { 
    const overlay = document.getElementById('pt-help-overlay');
    const helpImg = document.getElementById('pt-help-img');
    
    // Store the original image so we can put it back later
    const originalSrc = helpImg.src; 

    // 1. Swap to the second image instantly
    helpImg.src = ""; 

    // 2. Wait 600 milliseconds (0.6 seconds), then close the modal
    setTimeout(function() {
      overlay.classList.remove('open');
      
      // 3. Reset the image back to the original gorilla AFTER the modal fades out
      setTimeout(function() {
        helpImg.src = originalSrc;
      }, 30); 
      
    }, 30); // Change '600' to make the flash longer or shorter
  };

  function ptRenderCal() {
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('pt-cal-month').textContent = months[calMonth] + ' ' + calYear;
    const grid = document.getElementById('pt-cal-grid');
    grid.innerHTML = '';
    ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => {
      const el = document.createElement('div');
      el.className = 'pt-cal-dow'; el.textContent = d;
      grid.appendChild(el);
    });
    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const today = new Date();
    const selVal = document.getElementById('pt-date').value.trim();
    let selDay = null, selMon = null, selYr = null;
    if (selVal.length === 10) {
      const parts = selVal.split('/');
      selMon = parseInt(parts[0]) - 1;
      selDay = parseInt(parts[1]);
      selYr = parseInt(parts[2]);
    }
    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div');
      el.className = 'pt-cal-day empty'; grid.appendChild(el);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const el = document.createElement('div');
      el.className = 'pt-cal-day';
      el.textContent = d;
      const isToday = d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear();
      const isSel = selDay === d && selMon === calMonth && selYr === calYear;
      if (isSel) el.classList.add('selected');
      else if (isToday) el.classList.add('today');
      el.addEventListener('click', function() {
        const mm = String(calMonth + 1).padStart(2, '0');
        const dd = String(d).padStart(2, '0');
        document.getElementById('pt-date').value = mm + '/' + dd + '/' + calYear;
        document.getElementById('pt-cal-popup').classList.remove('open');
        ptRenderCal();
      });
      grid.appendChild(el);
    }
  }

  window.ptToggleCal = function() {
    const popup = document.getElementById('pt-cal-popup');
    const isOpen = popup.classList.contains('open');
    if (isOpen) { popup.classList.remove('open'); return; }
    const selVal = document.getElementById('pt-date').value.trim();
    if (selVal.length === 10) {
      const parts = selVal.split('/');
      const m = parseInt(parts[0]) - 1;
      const y = parseInt(parts[2]);
      if (!isNaN(m) && !isNaN(y)) { calMonth = m; calYear = y; }
    }
    ptRenderCal();
    popup.classList.add('open');
  };

  window.ptCalNav = function(dir) {
    calMonth += dir;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    if (calMonth < 0) { calMonth = 11; calYear--; }
    ptRenderCal();
  };

  function ptCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  }

  function ptFlashBtn(id, orig) {
    const btn = document.getElementById(id);
    btn.textContent = 'Copied!';
    const oldBg = btn.style.background;
    btn.style.background = 'var(--success)';
    btn.style.color = '#fff';
    setTimeout(() => { btn.textContent = orig; btn.style.background = oldBg; btn.style.color = ''; }, 1400);
  }

  window.ptToggleNewCode = function() { document.getElementById('pt-newcode').classList.toggle('active'); };

  window.ptClear = function(silent = false) {
    document.querySelectorAll('.pt-input, .pt-input-standalone, #pt-date').forEach(el => el.value = '');
    document.querySelectorAll('.pt-req-pill').forEach(el => el.classList.remove('selected'));
    document.querySelectorAll('.pt-work-pill').forEach(el => el.classList.remove('active'));
    document.getElementById('pt-newcode').classList.remove('active');
    document.getElementById('pt-confirm').classList.add('active');
    document.getElementById('pt-notes').value = '';
    if(!silent) showToast('Fields Cleared');
  };

  // ----- Text Generation Shared Helpers -----

  function ptGetSubjectText() {
    const name = document.getElementById('pt-name').value.trim();
    const sol  = document.getElementById('pt-soli').value.trim();
    const wc   = document.getElementById('pt-wc').value.trim();
    const rc   = document.getElementById('pt-rc').value.trim();
    if (!name && !sol && !wc && !rc) return '';
    let text = 'Contract Change Request for ' + name;
    if (sol) text += ' ' + sol;
    if (wc)  text += ' ' + wc;
    if (rc)  text += ' | ' + rc;
    return text.trim();
  }

  window.ptCopySubject = function() {
    const text = ptGetSubjectText();
    if (!text) return;
    ptCopy(text);
    ptFlashBtn('pt-subject-btn', 'Copy Email Subject');
  };

  function ptGetWorkObjects() {
    var lines = [];
    if (document.getElementById('pt-w1').classList.contains('active')) lines.push('ADDCHANGE');
    if (document.getElementById('pt-w2').classList.contains('active')) lines.push('SNAMCHANGE');
    if (document.getElementById('pt-w3').classList.contains('active')) lines.push('EFT');
    if (document.getElementById('pt-w4').classList.contains('active')) lines.push('ANNUALIZATION');
    if (document.getElementById('pt-w5').classList.contains('active')) lines.push('ASSIGNMENT');
    var lch = document.getElementById('pt-lch').value.trim();
    if (lch) lines.push('LCHTERM for ' + lch);
    if (!lines.length) return '';
    return 'Created work objects for the following:\n' + lines.join('\n');
  }

  function ptGetRequestLines() {
    let count = 1, lines = [];
    if (document.getElementById('pt-t1').value.trim()) lines.push((count++) + '. Contract level change to ' + document.getElementById('pt-t1').value.trim());
    if (document.getElementById('pt-t2').value.trim()) lines.push((count++) + '. Commission schedule change to ' + document.getElementById('pt-t2').value.trim());
    if (document.getElementById('pt-t3').value.trim()) lines.push((count++) + '. Direct upline change to ' + document.getElementById('pt-t3').value.trim());
    return lines;
  }

  function ptGetLchLine() {
    const lch = document.getElementById('pt-lch').value.trim();
    if (!lch) return '';
    const sol = document.getElementById('pt-soli').value.trim();
    const wc  = document.getElementById('pt-wc').value.trim();
    const rc  = document.getElementById('pt-rc').value.trim();
    let parts = [];
    if (wc) parts.push(wc); if (sol) parts.push(sol); if (rc) parts.push(rc);
    const useWord = parts.length > 1 ? 'codes' : 'code';
    let line = "Please note that we've a created termination request for " + lch + '.';
    if (parts.length > 0) line += ' Moving forward, please use code ' + useWord + ' ' + parts.join(' and ') + ' when submitting business.';
    return line;
  }

  function ptGetEmailBodyText() {
    const reqLines = ptGetRequestLines();
    const isNew = document.getElementById('pt-newcode').classList.contains('active');
    if (!reqLines.length && !isNew) return null;
    
    const sol = document.getElementById('pt-soli').value.trim();
    const wc  = document.getElementById('pt-wc').value.trim();
    const rc  = document.getElementById('pt-rc').value.trim();
    const ncLines = [];
    if (rc) ncLines.push('          Recruiting: ' + rc);
    if (wc) ncLines.push('          Writing: ' + wc);
    if (sol) ncLines.push('          Solicitor: ' + sol);
    let out = [];
    if (reqLines.length > 0) {
      out.push(reqLines[0]);
      if (isNew && ncLines.length) { out.push('   New assigned codes:'); ncLines.forEach(l => out.push(l)); }
      for (let i = 1; i < reqLines.length; i++) out.push(reqLines[i]);
    } else if (isNew && ncLines.length) {
      out.push('   New assigned codes:'); ncLines.forEach(l => out.push(l));
    }
    out.push('', 'Effective date: ' + document.getElementById('pt-date').value.trim());
    const lch = ptGetLchLine(); if (lch) out.push('', lch);
    return out.join('\n');
  }

  function ptGetDocText() {
    const reqLines = ptGetRequestLines();
    const objects  = ptGetWorkObjects();
    const isNew    = document.getElementById('pt-newcode').classList.contains('active');
    if (!reqLines.length && !objects && !isNew) return '';
    
    const sol = document.getElementById('pt-soli').value.trim();
    const wc  = document.getElementById('pt-wc').value.trim();
    const rc  = document.getElementById('pt-rc').value.trim();
    const ncLines = [];
    if (rc) ncLines.push('             Recruiting: ' + rc);
    if (wc) ncLines.push('             Writing: ' + wc);
    if (sol) ncLines.push('             Solicitor: ' + sol);
    
    let reqBlock = 'Processed the following requests:\n';
    if (reqLines.length > 0) {
      reqBlock += '\n' + reqLines[0];
      if (isNew && ncLines.length) { reqBlock += '\n     New assigned codes:'; ncLines.forEach(l => reqBlock += '\n' + l); }
      for (let i = 1; i < reqLines.length; i++) reqBlock += '\n' + reqLines[i];
    } else if (isNew && ncLines.length) {
      reqBlock += '\n     New assigned codes:'; ncLines.forEach(l => reqBlock += '\n' + l);
    }
    
    const dateVal = document.getElementById('pt-date').value.trim();
    reqBlock += '\n\nEffective date: ' + (dateVal || '');
    
    let parts = [reqBlock];
    if (document.getElementById('pt-confirm').classList.contains('active')) parts.push('Sent Confirmation Email (Burned as Source)');
    if (objects) parts.push(objects);
    
    return parts.join('\n\n');
  }

  // --- Button Actions ---

  window.ptHandlePill = function(action, el) {
    document.querySelectorAll('.pt-req-pill').forEach(p => p.classList.remove('selected'));
    el.classList.add('selected');

    if (action === 'standing') {
      var lch = document.getElementById('pt-lch').value.trim();
      ptCopy('Please terminate agent code: ' + lch + '. Code no longer needed.');
      showToast('Copied text!');
      return;
    }

    if (action === 'out') {
      var t1 = document.getElementById('pt-t1').value.trim();
      var t2 = document.getElementById('pt-t2').value.trim();
      var t3 = document.getElementById('pt-t3').value.trim();
      var addchnge = document.getElementById('pt-w1').classList.contains('active');
      var annualz  = document.getElementById('pt-w4').classList.contains('active');
      var eft      = document.getElementById('pt-w3').classList.contains('active');

      var lines = [];
      lines.push('Verified in PPRO:');
      if (t1) lines.push('Contract Level - ' + t1);
      if (t2) lines.push('Commission Schedule - ' + t2);
      if (t3) lines.push('Direct Upline - ' + t3);

      var bothActive = addchnge && eft;
      if (!bothActive) {
        if (!addchnge && !eft) {
          lines.push('Verified Contact & EFT information are correct');
        } else if (eft && !addchnge) {
          lines.push('Verified Contact information is correct');
        } else if (addchnge && !eft) {
          lines.push('Verified EFT information is correct');
        }
      }

      if (!annualz) {
        lines.push('Verified Agent has Annualization setup');
      }

      var workObjects = ptGetWorkObjects();
      if (workObjects) {
        lines.push('');
        lines.push(workObjects);
      }

      ptCopy(lines.join('\n'));
      showToast('Copied text!');
      return;
    }

    var map = {
      incorrect_signer: "Unable to process\nExisting recruiter signature needed - please provide revised recruiter page signed by any of the following existing signers to authorize the change request: \nPosted O/S in ELC UI\nFile sent to delay",
      unable_to_process: "Unable to process\n\nPosted O/S in ELC UI\nFile sent to delay",
      submit_a_form: "Verified agent's set up already updated.\nFile closed"
    };
    if (map[action]) {
      ptCopy(map[action]);
      showToast('Copied text!');
    }
  };

  window.ptReviewFlash = function() {
    ptCopy('Please review');
    const btn = document.getElementById('pt-review');
    btn.classList.add('flash');
    btn.innerHTML = 'Copied!';
    setTimeout(() => {
      btn.classList.remove('flash');
      btn.innerHTML = 'Please review';
    }, 1400);
  };

  window.ptCopyEmail = function() {
    const text = ptGetEmailBodyText();
    if (!text) { showToast('Nothing to copy!'); return; }
    ptCopy(text);
    ptFlashBtn('pt-email-btn', 'Copy Email Body');
  };

  window.ptCopyDoc = function(btnId = 'pt-doc-btn', origText = 'Copy Documentation') {
    const docText = ptGetDocText();
    if (!docText) { showToast('Nothing to copy!'); return; }
    ptCopy(docText);
    ptFlashBtn(btnId, origText);
  };

  window.ptEmailOutlook = function() {
    let generatedBody = ptGetEmailBodyText();
    if (!generatedBody) { showToast('Nothing to send!'); return; }
    
    generatedBody = generatedBody.replace(/\r?\n/g, '\r\n');

    const template = localStorage.getItem('hcEmailTemplate') || '';
    const lines = template.split(/\r?\n/);
    
    let before = lines.slice(0, 5);
    let after = lines.slice(5);

    while (before.length > 0 && before[before.length - 1].trim() === '') {
      before.pop();
    }
    while (after.length > 0 && after[0].trim() === '') {
      after.shift();
    }

    let finalBody = before.join('\r\n');
    
    if (finalBody.length > 0) {
      finalBody += '\r\n\r\n'; 
    }
    
    finalBody += generatedBody;
    
    if (after.length > 0) {
      finalBody += '\r\n\r\n' + after.join('\r\n');
    }

    const subject = ptGetSubjectText();
    const notesRaw = document.getElementById('pt-notes').value.trim();
    const emailRegex = /([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9_-]+)/gi;
    const emailMatches = notesRaw.match(emailRegex);
    const toEmails = emailMatches ? emailMatches.join(';') : '';

    const mailtoLink = 'mailto:' + encodeURIComponent(toEmails) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(finalBody);
    window.location.href = mailtoLink;
  };

  window.ptFormatDate = function(el) {
    let v = el.value.replace(/\D/g, '');
    if (v.length >= 5) v = v.slice(0,2) + '/' + v.slice(2,4) + '/' + v.slice(4,8);
    else if (v.length >= 3) v = v.slice(0,2) + '/' + v.slice(2);
    el.value = v;
  };

  // ----- Tracker Logic -----

  window.ptAddToTracker = function() {
    const docText = ptGetDocText();
    if (!docText) { showToast('No data to save!'); return; }

    const d = new Date();
    const dateToday = (d.getMonth() + 1) + '/' + d.getDate();

    const sol = document.getElementById('pt-soli').value.trim();
    const wc  = document.getElementById('pt-wc').value.trim();
    const rc  = document.getElementById('pt-rc').value.trim();
    const codes = [sol, wc, rc].filter(Boolean).join(' / ');

    const newItem = {
      id: Date.now(),
      date: dateToday,
      codes: codes,
      doc: docText
    };

    let trackerData = JSON.parse(localStorage.getItem('hcTrackerData') || '[]');
    trackerData.push(newItem);
    localStorage.setItem('hcTrackerData', JSON.stringify(trackerData));

    ptClear(true); 
    showToast('Added to Tracker & Cleared Fields');
  };

  window.ptRenderTracker = function() {
    const body = document.getElementById('pt-tracker-body');
    let trackerData = JSON.parse(localStorage.getItem('hcTrackerData') || '[]');
    body.innerHTML = '';
    if(trackerData.length === 0) {
      body.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px; font-weight: 500;">Tracker is empty.</p>';
      return;
    }
    trackerData.forEach(item => {
      const el = document.createElement('div');
      el.className = 'pt-tracker-item';
      
      // Escape content for safe rendering
      const safeDate = item.date.replace(/"/g, '&quot;');
      const safeCodes = item.codes.replace(/"/g, '&quot;');
      const safeDoc = item.doc.replace(/</g, '&lt;').replace(/>/g, '&gt;');
      
      el.innerHTML = `
        <div class="pt-ti-header">
          <input type="text" class="pt-ti-date" id="ti-date-${item.id}" value="${safeDate}" title="Date">
          <input type="text" class="pt-ti-codes" id="ti-codes-${item.id}" value="${safeCodes}" placeholder="Codes">
          <div class="pt-ti-actions">
            <button class="save-btn" onclick="ptSaveTrackerItem(${item.id})">Save</button>
            <button class="del-btn" onclick="ptDeleteTrackerItem(${item.id})">Delete</button>
          </div>
        </div>
        <textarea class="pt-ti-doc" id="ti-doc-${item.id}">${safeDoc}</textarea>
      `;
      body.appendChild(el);
    });
  };

  window.ptSaveTrackerItem = function(id) {
    let trackerData = JSON.parse(localStorage.getItem('hcTrackerData') || '[]');
    const idx = trackerData.findIndex(i => i.id === id);
    if(idx > -1) {
      trackerData[idx].date = document.getElementById(`ti-date-${id}`).value;
      trackerData[idx].codes = document.getElementById(`ti-codes-${id}`).value;
      trackerData[idx].doc = document.getElementById(`ti-doc-${id}`).value;
      localStorage.setItem('hcTrackerData', JSON.stringify(trackerData));
      showToast('Tracker Item Saved!');
    }
  };

  window.ptDeleteTrackerItem = function(id) {
    if(!confirm('Are you sure you want to delete this tracker entry?')) return;
    let trackerData = JSON.parse(localStorage.getItem('hcTrackerData') || '[]');
    trackerData = trackerData.filter(i => i.id !== id);
    localStorage.setItem('hcTrackerData', JSON.stringify(trackerData));
    ptRenderTracker();
    showToast('Item Deleted');
  };

  window.ptDeleteAllTracker = function() {
    let trackerData = JSON.parse(localStorage.getItem('hcTrackerData') || '[]');
    if (trackerData.length === 0) {
      showToast('Tracker is already empty');
      return;
    }
    if (!confirm('Are you sure you want to delete ALL tracker entries? This cannot be undone.')) return;
    localStorage.setItem('hcTrackerData', JSON.stringify([]));
    ptRenderTracker();
    showToast('All items deleted');
  };

  window.ptOpenTracker = function() {
    ptRenderTracker();
    document.getElementById('pt-tracker-overlay').classList.add('open');
  };

  window.ptCloseTracker = function() {
    document.getElementById('pt-tracker-overlay').classList.remove('open');
  };

  window.ptDownloadExcel = function() {
    if (typeof XLSX === 'undefined') {
      showToast('Excel library loading, please try again in a moment...');
      return;
    }
    let trackerData = JSON.parse(localStorage.getItem('hcTrackerData') || '[]');
    if(trackerData.length === 0) { showToast('No data to download'); return; }

    // Strip out the extra spaces on each line AND collapse multiple blank lines into a single line
    const formattedData = trackerData.map(item => ({
      "Date": item.date,
      "Codes": item.codes,
      "Documentation": item.doc.replace(/^[ \u00A0]+/gm, '').replace(/[\r\n]+/g, '\n')
    }));

    // Convert to Worksheet
    const ws = XLSX.utils.json_to_sheet(formattedData);

    // Enforce Column Widths to Autofit/Prevent Bleed (wch = character width)
    ws['!cols'] = [
      { wch: 12 },   // Date Column Width
      { wch: 30 },   // Codes Column Width
      { wch: 100 }   // Documentation Column Width
    ];

    // Apply styles to all cells so that text wrapping works automatically
    const range = XLSX.utils.decode_range(ws['!ref']);
    for (let R = range.s.r; R <= range.e.r; ++R) {
      for (let C = range.s.c; C <= range.e.c; ++C) {
        let cell_address = { c: C, r: R };
        let cell_ref = XLSX.utils.encode_cell(cell_address);
        
        if (!ws[cell_ref]) continue;

        // Base styling for all cells (Align top, wrap text)
        ws[cell_ref].s = {
          alignment: {
            vertical: "top",
            wrapText: true
          }
        };

        // Header specific styling (Row 0)
        if (R === 0) {
          ws[cell_ref].s.font = { bold: true };
          ws[cell_ref].s.alignment.horizontal = "center";
          ws[cell_ref].s.alignment.vertical = "center";
        }
      }
    }

    // Create a new Workbook and append the sheet
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Processed Tracker");

    // Automatically trigger the download (Outputs a true .xlsx file)
    XLSX.writeFile(wb, "Processed_Tracker.xlsx");
  };

})();
</script>
