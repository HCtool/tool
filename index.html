<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H&C Personal Tool</title>
<style>
  :root {
    /* iOS Light Mode Colors */
    --text-main: #000000;
    --text-muted: #3c3c4399; /* iOS Secondary Label */
    --glass-bg: rgba(250, 250, 250, 0.65);
    --glass-border: rgba(255, 255, 255, 0.6);
    --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    --input-bg: rgba(255, 255, 255, 0.6);
    --input-border: rgba(0, 0, 0, 0.04);
    --btn-bg: rgba(0, 0, 0, 0.05);
    
    /* iOS System Colors */
    --accent: #007AFF; /* iOS Blue */
    --accent-hover: #005fcc;
    --danger: #FF3B30; /* iOS Red */
    --warning: #FF9500; /* iOS Orange */
    --success: #34C759; /* iOS Green */
    
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 24px;
  }

  /* iOS Dark Mode Overrides */
  body.dark-mode {
    /* Deep abstract fluid background */
    background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center center / cover no-repeat fixed !important;
    
    --text-main: #FFFFFF;
    --text-muted: #ebebf599; 
    --glass-bg: rgba(28, 28, 30, 0.55);
    --glass-border: rgba(255, 255, 255, 0.15);
    --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    --input-bg: rgba(0, 0, 0, 0.25);
    --input-border: rgba(255, 255, 255, 0.1);
    --btn-bg: rgba(255, 255, 255, 0.1);
    
    --accent: #0A84FF; /* iOS Dark Blue */
    --accent-hover: #006ee6;
    --danger: #FF453A; /* iOS Dark Red */
    --warning: #FF9F0A;
    --success: #30D158;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    /* Native Apple System Fonts */
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    
    /* Vibrant abstract mesh background */
    background: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center center / cover no-repeat fixed;
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 40px 20px; 
    transition: background 0.5s ease;
    -webkit-font-smoothing: antialiased;
  }

  /* Core iOS Glass Panel */
  .pt-card {
    background: var(--glass-bg);
    backdrop-filter: blur(25px) saturate(200%);
    -webkit-backdrop-filter: blur(25px) saturate(200%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 640px;
    box-shadow: var(--glass-shadow);
    position: relative;
    transition: all 0.3s ease;
  }

  /* Header */
  .pt-header {
    background: rgba(255, 255, 255, 0.1);
    border-bottom: 1px solid var(--glass-border);
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    transition: all 0.3s ease;
  }
  body.dark-mode .pt-header { background: rgba(0, 0, 0, 0.1); }

  .pt-header-left { display: flex; align-items: center; gap: 14px; }
  .pt-header-icon {
    width: 46px; height: 46px;
    background: var(--input-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    transition: all 0.3s ease;
  }
  .pt-title { color: var(--text-main); font-size: 22px; font-weight: 700; letter-spacing: -0.4px; transition: color 0.3s; }
  .pt-subtitle { color: var(--text-muted); font-size: 13px; font-weight: 500; letter-spacing: 0.02em; text-transform: uppercase; margin-top: 2px; transition: color 0.3s; }

  /* Header Buttons */
  .pt-btn-clear, .pt-btn-newcode, .pt-btn-help, .pt-btn-theme {
    background: var(--btn-bg); 
    border: none;
    color: var(--text-main); 
    border-radius: var(--radius-sm); 
    padding: 8px 14px; 
    font-size: 14px; 
    font-weight: 600;
    cursor: pointer; 
    transition: all 0.2s ease; 
    font-family: inherit;
  }
  
  .pt-btn-theme, .pt-btn-help {
    border-radius: 50%;
    width: 32px; height: 32px; padding: 0;
    font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  .pt-btn-clear:hover, .pt-btn-newcode:hover, .pt-btn-theme:hover, .pt-btn-help:hover { 
    filter: brightness(0.9); transform: scale(0.97); 
  }
  body.dark-mode .pt-btn-clear:hover, body.dark-mode .pt-btn-newcode:hover, body.dark-mode .pt-btn-theme:hover, body.dark-mode .pt-btn-help:hover { 
    filter: brightness(1.2); 
  }

  .pt-btn-clear { color: var(--danger); }
  .pt-btn-newcode.active {
    background: var(--warning); color: #fff;
  }

  /* Help Modal */
  .pt-help-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4);
    z-index: 1000; align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .pt-help-overlay.open { display: flex; animation: pt-fade 0.2s ease; }
  @keyframes pt-fade { from { opacity: 0; } to { opacity: 1; } }
  
  .pt-help-modal {
    background: var(--glass-bg); backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%); 
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg); max-width: 420px; width: 100%;
    overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    position: relative;
  }
  .pt-help-modal img { width: 100%; display: block; }
  .pt-help-close {
    position: absolute; top: 12px; right: 12px; width: 32px; height: 32px;
    border-radius: 50%; border: none; background: rgba(0,0,0,0.5); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .pt-help-close:hover { background: rgba(0,0,0,0.7); transform: scale(1.05); }

  /* Body & Layout */
  .pt-body { padding: 28px 24px; }
  .pt-section-label {
    font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); margin: 24px 0 10px; padding-left: 4px; transition: color 0.3s;
  }
  .pt-section-label:first-child { margin-top: 0; }

  /* Inputs & Rows */
  .pt-row {
    margin-bottom: 1px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
    background: var(--input-bg); padding: 8px 16px; border: 1px solid var(--input-border); 
    transition: all 0.3s;
  }
  
  /* iOS Grouped List Style */
  .pt-row:first-of-type { border-radius: var(--radius-md) var(--radius-md) 0 0; border-bottom: none; }
  .pt-row:nth-of-type(2) { border-radius: 0; border-bottom: none; }
  .pt-row:nth-of-type(3) { border-radius: 0 0 var(--radius-md) var(--radius-md); margin-bottom: 16px; }
  
  .pt-label { font-size: 15px; font-weight: 500; color: var(--text-main); white-space: nowrap; width: 160px; transition: color 0.3s; }
  
  .pt-input {
    padding: 8px 12px; border: none; border-radius: 6px; flex: 1; min-width: 80px;
    outline: none; font-size: 15px; font-weight: 400; font-family: inherit; 
    background: transparent; color: var(--text-main);
    text-transform: uppercase; transition: all 0.3s ease; text-align: right;
  }
  .pt-input::placeholder { text-transform: none; color: var(--text-muted); font-weight: 400; }
  
  /* Standalone Inputs */
  .pt-input-standalone {
    background: var(--input-bg); border: 1px solid var(--input-border); 
    border-radius: var(--radius-sm); padding: 12px 14px; text-align: left;
  }

  /* Date Picker */
  .pt-date-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding: 12px 16px;
    background: var(--input-bg); border: 1px solid var(--input-border); border-radius: var(--radius-md);
    position: relative; transition: all 0.3s; justify-content: space-between;
  }

  .pt-date-label {
    font-size: 15px; font-weight: 500; color: var(--text-main); white-space: nowrap;
    cursor: pointer; user-select: none; transition: color 0.2s;
    display: flex; align-items: center; gap: 8px;
  }
  .pt-date-input {
    width: 120px; padding: 8px 12px; border: none; border-radius: 8px;
    outline: none; font-size: 15px; font-weight: 500; font-family: inherit; 
    background: var(--btn-bg); color: var(--accent); text-align: center;
    transition: all 0.3s ease; cursor: pointer;
  }

  /* Calendar Popup */
  .pt-cal-popup {
    display: none; position: absolute; top: calc(100% + 8px); right: 0; z-index: 999;
    background: var(--glass-bg); backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%);
    border: 1px solid var(--glass-border); border-radius: var(--radius-md);
    box-shadow: var(--glass-shadow); padding: 16px; min-width: 280px; transition: all 0.3s;
  }
  .pt-cal-popup.open { display: block; animation: pt-scaleUp 0.2s cubic-bezier(0.16, 1, 0.3, 1); transform-origin: top right; }
  @keyframes pt-scaleUp { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  
  .pt-cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .pt-cal-nav button {
    background: var(--btn-bg); border: none; border-radius: 50%; cursor: pointer;
    font-size: 16px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    color: var(--accent); transition: all 0.2s ease; font-weight: bold;
  }
  .pt-cal-month { font-size: 15px; font-weight: 600; color: var(--text-main); transition: color 0.3s; }
  .pt-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .pt-cal-dow { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 4px 0; transition: color 0.3s; }
  
  .pt-cal-day {
    text-align: center; font-size: 15px; font-weight: 400; padding: 8px 2px; border-radius: 50%;
    cursor: pointer; color: var(--text-main); transition: all 0.2s ease;
  }
  .pt-cal-day:hover { background: var(--btn-bg); color: var(--accent); }
  .pt-cal-day.today { font-weight: 600; color: var(--accent); background: rgba(0, 122, 255, 0.1); }
  .pt-cal-day.selected { background: var(--accent); color: #fff; font-weight: 600; }
  .pt-cal-day.empty { cursor: default; background: none; }

  /* Confirmation Alert Button */
  #pt-confirm {
    width: 100%; margin: 16px 0; padding: 14px 16px; 
    background: var(--input-bg); border: 1px solid var(--input-border); border-radius: var(--radius-sm); 
    cursor: pointer; font-size: 15px; font-weight: 600; color: var(--danger); font-family: inherit; text-align: left;
    transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  #pt-confirm.active { background: var(--success); color: #fff; border-color: transparent; }

  /* Pills General */
  .pt-pills-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }

  /* Work Objects Pills & Req Pills */
  .pt-work-pill, .pt-req-pill {
    padding: 8px 16px; border-radius: 20px; border: 1px solid var(--glass-border); 
    background: var(--input-bg); color: var(--text-main); font-size: 13px; font-weight: 500; 
    cursor: pointer; transition: all 0.2s ease; font-family: inherit;
  }
  
  .pt-work-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pt-req-pill.selected { background: var(--warning); border-color: var(--warning); color: #fff; }

  /* Main Action Buttons */
  .pt-btn-container { display: flex; gap: 12px; margin-top: 24px; }
  .pt-btn-action {
    flex: 1; padding: 14px; border: none; border-radius: var(--radius-md); cursor: pointer; font-size: 15px;
    font-weight: 600; font-family: inherit; transition: all 0.2s ease; display: flex;
    align-items: center; justify-content: center; gap: 8px; color: #fff;
  }
  .pt-btn-action:hover { transform: scale(0.98); opacity: 0.9; }
  
  .pt-btn-subject { background: var(--accent); width: 100%; margin-bottom: 24px; }
  .pt-btn-email { background: var(--accent); }
  .pt-btn-doc { background: #5856D6; /* iOS Indigo */ }

  /* Review Button */
  .pt-review-btn {
    width: 100%; margin: 8px 0 0; padding: 14px; background: var(--btn-bg);
    border: none; border-radius: var(--radius-md); cursor: pointer; font-size: 15px;
    font-weight: 600; color: var(--accent); font-family: inherit; display: flex;
    align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease;
  }
  .pt-review-btn.flash { background: var(--success); color: #fff; }

  /* Dividers & Notes */
  .pt-divider { height: 1px; background: var(--glass-border); margin: 24px 0; border-radius: 2px; }
  
  #pt-notes { 
    width: 100%; min-height: 120px; padding: 14px; border: 1px solid var(--input-border); border-radius: var(--radius-md); 
    font-size: 15px; font-weight: 400; font-family: inherit; color: var(--text-main); background: var(--input-bg); 
    resize: vertical; outline: none; transition: all 0.3s ease; line-height: 1.5; 
  }
  #pt-notes::placeholder { color: var(--text-muted); font-weight: 400; }

  .pt-footer { padding: 16px 24px 24px; text-align: center; font-size: 13px; color: var(--text-muted); font-weight: 500; border-top: 1px solid var(--glass-border); background: rgba(0,0,0,0.02); transition: all 0.3s;}
</style>
</head>
<body>

<div class="pt-card">
  <div class="pt-header">
    <div class="pt-header-left">
      <div class="pt-header-icon">📋</div>
      <div>
        <div class="pt-title">H&C</div>
        <div class="pt-subtitle">Personal Tool</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button id="pt-newcode" class="pt-btn-newcode" onclick="ptToggleNewCode()">New Code</button>
      <button class="pt-btn-clear" onclick="ptClear()">Clear</button>
      <button class="pt-btn-theme" onclick="ptToggleTheme()" title="Switch to Dark Mode">🌙</button>
      <button class="pt-btn-help" onclick="ptOpenHelp()" title="Help">?</button>
    </div>
  </div>

  <div class="pt-body">
    <div class="pt-section-label">Agent Info</div>
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
      <input class="pt-input pt-input-standalone" autocomplete="off" id="pt-name" placeholder="Name" style="flex:2;min-width:120px;">
      <input class="pt-input pt-input-standalone" autocomplete="off" id="pt-soli" placeholder="Soli" style="flex:1;min-width:70px;">
      <input class="pt-input pt-input-standalone" autocomplete="off" id="pt-wc" placeholder="WC" style="flex:1;min-width:70px;">
      <input class="pt-input pt-input-standalone" autocomplete="off" id="pt-rc" placeholder="RC" style="flex:1;min-width:70px;">
    </div>
    <button class="pt-btn-action pt-btn-subject" id="pt-subject-btn" onclick="ptCopySubject()">Copy Email Subject</button>

    <div class="pt-section-label">Request Details</div>
    <div>
      <div class="pt-row"><span class="pt-label">Contract level to</span><input class="pt-input" autocomplete="off" id="pt-t1" placeholder="Enter value"></div>
      <div class="pt-row"><span class="pt-label">Comm schedule to</span><input class="pt-input" autocomplete="off" id="pt-t2" placeholder="Enter value"></div>
      <div class="pt-row"><span class="pt-label">Direct upline to</span><input class="pt-input" autocomplete="off" id="pt-t3" placeholder="Enter value"></div>
    </div>

    <div class="pt-date-row" id="pt-date-row">
      <span class="pt-date-label" onclick="ptToggleCal()" title="Open calendar">
        Effective Date
      </span>
      <!-- MODIFICATION: Removed the 'readonly' attribute here -->
      <input class="pt-date-input" autocomplete="off" id="pt-date" placeholder="MM/DD/YYYY" oninput="ptFormatDate(this)" maxlength="10" onclick="ptToggleCal()">
      
      <div class="pt-cal-popup" id="pt-cal-popup">
        <div class="pt-cal-nav">
          <button onclick="ptCalNav(-1)">&#8249;</button>
          <span class="pt-cal-month" id="pt-cal-month"></span>
          <button onclick="ptCalNav(1)">&#8250;</button>
        </div>
        <div class="pt-cal-grid" id="pt-cal-grid"></div>
      </div>
    </div>

    <button id="pt-confirm" class="active" onclick="this.classList.toggle('active')">
      Sent Confirmation Email (Burned as Source)
    </button>

    <div class="pt-section-label">Work Objects</div>
    <div class="pt-pills-wrap">
      <button class="pt-work-pill" id="pt-w1" onclick="this.classList.toggle('active')">ADDCHNGE</button>
      <button class="pt-work-pill" id="pt-w4" onclick="this.classList.toggle('active')">ANNUALZ</button>
      <button class="pt-work-pill" id="pt-w3" onclick="this.classList.toggle('active')">EFT</button>
      <button class="pt-work-pill" id="pt-w2" onclick="this.classList.toggle('active')">SIMCHANGE</button>
      <button class="pt-work-pill" id="pt-w5" onclick="this.classList.toggle('active')">ASSGNMENT</button>
    </div>
    
    <div class="pt-date-row" style="margin-bottom: 8px;">
        <span class="pt-label" style="width: auto; font-size:15px;">LCHTERM</span>
        <input class="pt-input" autocomplete="off" id="pt-lch" placeholder="Enter details" style="text-align: right; background: transparent; padding: 0;">
    </div>

    <div class="pt-btn-container">
      <button class="pt-btn-action pt-btn-email" id="pt-email-btn" onclick="ptCopyEmail()">Copy Email Body</button>
      <button class="pt-btn-action pt-btn-doc" id="pt-doc-btn" onclick="ptCopyDoc()">Copy Documentation</button>
    </div>

    <div class="pt-divider"></div>

    <div>
      <div class="pt-section-label">Outstanding Requirements</div>
      <div class="pt-pills-wrap">
        <button class="pt-req-pill" onclick="ptHandlePill('incorrect_signer', this)">Incorrect Signer</button>
        <button class="pt-req-pill" onclick="ptHandlePill('unable_to_process', this)">Unable2Process</button>
        <button class="pt-req-pill" onclick="ptHandlePill('submit_a_form', this)">Old Verified</button>
        <button class="pt-req-pill" onclick="ptHandlePill('out', this)">New Verified</button>
        <button class="pt-req-pill" onclick="ptHandlePill('standing', this)">LCHTERM</button>
      </div>
      <button id="pt-review" class="pt-review-btn" onclick="ptReviewFlash()">
        Please review
      </button>
    </div>

    <div class="pt-section-label">Notes</div>
    <textarea id="pt-notes" placeholder="Type additional notes here..."></textarea>
  </div>

  <div class="pt-footer">Personal Tool</div>
</div>

<div class="pt-help-overlay" id="pt-help-overlay" onclick="if(event.target===this) ptCloseHelp()">
  <div class="pt-help-modal">
    <button class="pt-help-close" onclick="ptCloseHelp()">✕</button>
    <img src="Ask the Tenured" alt="Help">
  </div>
</div>

<script>
(function() {
  var calYear, calMonth;
  var now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();

  // Dark Mode Toggle Logic
  window.ptToggleTheme = function() {
    const body = document.body;
    const btn = document.querySelector('.pt-btn-theme');
    
    body.classList.toggle('dark-mode');
    
    if(body.classList.contains('dark-mode')) {
      btn.textContent = '☀️';
      btn.title = 'Switch to Light Mode';
    } else {
      btn.textContent = '🌙';
      btn.title = 'Switch to Dark Mode';
    }
  };

  document.getElementById('pt-soli').addEventListener('input', function() { if (this.value) document.getElementById('pt-wc').value = ''; });
  document.getElementById('pt-wc').addEventListener('input', function() { if (this.value) document.getElementById('pt-soli').value = ''; });

  document.querySelectorAll('.pt-input, .pt-input-standalone').forEach(el => {
    if(el.id !== 'pt-date'){
        el.addEventListener('input', function() {
        const pos = this.selectionStart;
        this.value = this.value.toUpperCase();
        this.setSelectionRange(pos, pos);
        });
        el.addEventListener('blur', function() { this.value = this.value.trim(); });
    }
  });

  document.addEventListener('click', function(e) {
    const popup = document.getElementById('pt-cal-popup');
    const row = document.getElementById('pt-date-row');
    if (!row.contains(e.target)) popup.classList.remove('open');
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') ptCloseHelp();
  });

  window.ptOpenHelp = function() {
    document.getElementById('pt-help-overlay').classList.add('open');
  };
  window.ptCloseHelp = function() {
    document.getElementById('pt-help-overlay').classList.remove('open');
  };

  function ptRenderCal() {
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('pt-cal-month').textContent = months[calMonth] + ' ' + calYear;
    const grid = document.getElementById('pt-cal-grid');
    grid.innerHTML = '';
    ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => {
      const el = document.createElement('div');
      el.className = 'pt-cal-dow'; el.textContent = d;
      grid.appendChild(el);
    });
    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const today = new Date();
    const selVal = document.getElementById('pt-date').value.trim();
    let selDay = null, selMon = null, selYr = null;
    if (selVal.length === 10) {
      const parts = selVal.split('/');
      selMon = parseInt(parts[0]) - 1;
      selDay = parseInt(parts[1]);
      selYr = parseInt(parts[2]);
    }
    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div');
      el.className = 'pt-cal-day empty'; grid.appendChild(el);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const el = document.createElement('div');
      el.className = 'pt-cal-day';
      el.textContent = d;
      const isToday = d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear();
      const isSel = selDay === d && selMon === calMonth && selYr === calYear;
      if (isSel) el.classList.add('selected');
      else if (isToday) el.classList.add('today');
      el.addEventListener('click', function() {
        const mm = String(calMonth + 1).padStart(2, '0');
        const dd = String(d).padStart(2, '0');
        document.getElementById('pt-date').value = mm + '/' + dd + '/' + calYear;
        document.getElementById('pt-cal-popup').classList.remove('open');
        ptRenderCal();
      });
      grid.appendChild(el);
    }
  }

  window.ptToggleCal = function() {
    const popup = document.getElementById('pt-cal-popup');
    const isOpen = popup.classList.contains('open');
    if (isOpen) { popup.classList.remove('open'); return; }
    const selVal = document.getElementById('pt-date').value.trim();
    if (selVal.length === 10) {
      const parts = selVal.split('/');
      const m = parseInt(parts[0]) - 1;
      const y = parseInt(parts[2]);
      if (!isNaN(m) && !isNaN(y)) { calMonth = m; calYear = y; }
    }
    ptRenderCal();
    popup.classList.add('open');
  };

  window.ptCalNav = function(dir) {
    calMonth += dir;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    if (calMonth < 0) { calMonth = 11; calYear--; }
    ptRenderCal();
  };

  function ptCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  }

  function ptFlashBtn(id, orig) {
    const btn = document.getElementById(id);
    btn.textContent = 'Copied!';
    const oldBg = btn.style.background;
    btn.style.background = 'var(--success)';
    setTimeout(() => { btn.textContent = orig; btn.style.background = oldBg; }, 1400);
  }

  window.ptToggleNewCode = function() { document.getElementById('pt-newcode').classList.toggle('active'); };

  window.ptClear = function() {
    document.querySelectorAll('.pt-input, .pt-input-standalone, #pt-date').forEach(el => el.value = '');
    document.querySelectorAll('.pt-req-pill').forEach(el => el.classList.remove('selected'));
    document.querySelectorAll('.pt-work-pill').forEach(el => el.classList.remove('active'));
    document.getElementById('pt-newcode').classList.remove('active');
    document.getElementById('pt-confirm').classList.add('active');
    document.getElementById('pt-notes').value = '';
  };

  window.ptCopySubject = function() {
    const name = document.getElementById('pt-name').value.trim();
    const sol  = document.getElementById('pt-soli').value.trim();
    const wc   = document.getElementById('pt-wc').value.trim();
    const rc   = document.getElementById('pt-rc').value.trim();
    if (!name && !sol && !wc && !rc) return;
    let text = 'Contract Change Request for ' + name;
    if (sol) text += ' ' + sol;
    if (wc)  text += ' ' + wc;
    if (rc)  text += ' | ' + rc;
    ptCopy(text.trim());
    ptFlashBtn('pt-subject-btn', 'Copy Email Subject');
  };

  function ptGetWorkObjects() {
    var lines = [];
    if (document.getElementById('pt-w1').classList.contains('active')) lines.push('ADDCHANGE');
    if (document.getElementById('pt-w2').classList.contains('active')) lines.push('SNAMCHANGE');
    if (document.getElementById('pt-w3').classList.contains('active')) lines.push('EFT');
    if (document.getElementById('pt-w4').classList.contains('active')) lines.push('ANNUALIZATION');
    if (document.getElementById('pt-w5').classList.contains('active')) lines.push('ASSIGNMENT');
    var lch = document.getElementById('pt-lch').value.trim();
    if (lch) lines.push('LCHTERM for ' + lch);
    if (!lines.length) return '';
    return 'Created work objects for the following:\n' + lines.join('\n');
  }

  window.ptHandlePill = function(action, el) {
    document.querySelectorAll('.pt-req-pill').forEach(p => p.classList.remove('selected'));
    el.classList.add('selected');

    if (action === 'standing') {
      var lch = document.getElementById('pt-lch').value.trim();
      ptCopy('Please terminate agent code: ' + lch + '. Code no longer needed.');
      return;
    }

    if (action === 'out') {
      var t1 = document.getElementById('pt-t1').value.trim();
      var t2 = document.getElementById('pt-t2').value.trim();
      var t3 = document.getElementById('pt-t3').value.trim();
      var addchnge = document.getElementById('pt-w1').classList.contains('active');
      var annualz  = document.getElementById('pt-w4').classList.contains('active');
      var eft      = document.getElementById('pt-w3').classList.contains('active');

      var lines = [];
      lines.push('Verified in PPRO:');
      if (t1) lines.push('Contract Level - ' + t1);
      if (t2) lines.push('Commission Schedule - ' + t2);
      if (t3) lines.push('Direct Upline - ' + t3);

      var bothActive = addchnge && eft;
      if (!bothActive) {
        if (!addchnge && !eft) {
          lines.push('Verified Contact & EFT information are correct');
        } else if (eft && !addchnge) {
          lines.push('Verified Contact information is correct');
        } else if (addchnge && !eft) {
          lines.push('Verified EFT information is correct');
        }
      }

      if (!annualz) {
        lines.push('Verified Agent has Annualization setup');
      }

      var workObjects = ptGetWorkObjects();
      if (workObjects) {
        lines.push('');
        lines.push(workObjects);
      }

      ptCopy(lines.join('\n'));
      return;
    }

    var map = {
      incorrect_signer: "Unable to process\nExisting recruiter signature needed - please provide revised recruiter page signed by any of the following existing signers to authorize the change request: \nPosted O/S in ELC UI\nFile sent to delay",
      unable_to_process: "Unable to process\n\nPosted O/S in ELC UI\nFile sent to delay",
      submit_a_form: "Verified agent's set up already updated.\nFile closed"
    };
    if (map[action]) ptCopy(map[action]);
  };

  window.ptReviewFlash = function() {
    ptCopy('Please review');
    const btn = document.getElementById('pt-review');
    btn.classList.add('flash');
    btn.innerHTML = 'Copied!';
    setTimeout(() => {
      btn.classList.remove('flash');
      btn.innerHTML = 'Please review';
    }, 1400);
  };

  function ptGetRequestLines() {
    let count = 1, lines = [];
    if (document.getElementById('pt-t1').value.trim()) lines.push((count++) + '. Contract level change to ' + document.getElementById('pt-t1').value.trim());
    if (document.getElementById('pt-t2').value.trim()) lines.push((count++) + '. Commission schedule change to ' + document.getElementById('pt-t2').value.trim());
    if (document.getElementById('pt-t3').value.trim()) lines.push((count++) + '. Direct upline change to ' + document.getElementById('pt-t3').value.trim());
    return lines;
  }

  function ptGetLchLine() {
    const lch = document.getElementById('pt-lch').value.trim();
    if (!lch) return '';
    const sol = document.getElementById('pt-soli').value.trim();
    const wc  = document.getElementById('pt-wc').value.trim();
    const rc  = document.getElementById('pt-rc').value.trim();
    let parts = [];
    if (wc) parts.push(wc); if (sol) parts.push(sol); if (rc) parts.push(rc);
    const useWord = parts.length > 1 ? 'codes' : 'code';
    let line = "Please note that we've a created termination request for " + lch + '.';
    if (parts.length > 0) line += ' Moving forward, please use code ' + useWord + ' ' + parts.join(' and ') + ' when submitting business.';
    return line;
  }

  window.ptCopyEmail = function() {
    const reqLines = ptGetRequestLines();
    const isNew = document.getElementById('pt-newcode').classList.contains('active');
    if (!reqLines.length && !isNew) return;
    const sol = document.getElementById('pt-soli').value.trim();
    const wc  = document.getElementById('pt-wc').value.trim();
    const rc  = document.getElementById('pt-rc').value.trim();
    const ncLines = [];
    if (rc) ncLines.push('          Recruiting: ' + rc);
    if (wc) ncLines.push('          Writing: ' + wc);
    if (sol) ncLines.push('          Solicitor: ' + sol);
    let out = [];
    if (reqLines.length > 0) {
      out.push(reqLines[0]);
      if (isNew && ncLines.length) { out.push('   New assigned codes:'); ncLines.forEach(l => out.push(l)); }
      for (let i = 1; i < reqLines.length; i++) out.push(reqLines[i]);
    } else if (isNew && ncLines.length) {
      out.push('   New assigned codes:'); ncLines.forEach(l => out.push(l));
    }
    out.push('', 'Effective date: ' + document.getElementById('pt-date').value.trim());
    const lch = ptGetLchLine(); if (lch) out.push('', lch);
    ptCopy(out.join('\n'));
    ptFlashBtn('pt-email-btn', 'Copy Email Body');
  };

  window.ptCopyDoc = function() {
    const reqLines = ptGetRequestLines();
    const objects  = ptGetWorkObjects();
    const isNew    = document.getElementById('pt-newcode').classList.contains('active');
    if (!reqLines.length && !objects && !isNew) return;
    const sol = document.getElementById('pt-soli').value.trim();
    const wc  = document.getElementById('pt-wc').value.trim();
    const rc  = document.getElementById('pt-rc').value.trim();
    const ncLines = [];
    if (rc) ncLines.push('           Recruiting: ' + rc);
    if (wc) ncLines.push('           Writing: ' + wc);
    if (sol) ncLines.push('           Solicitor: ' + sol);
    let reqBlock = 'Processed the following requests:\n';
    if (reqLines.length > 0) {
      reqBlock += '\n' + reqLines[0];
      if (isNew && ncLines.length) { reqBlock += '\n     New assigned codes:'; ncLines.forEach(l => reqBlock += '\n' + l); }
      for (let i = 1; i < reqLines.length; i++) reqBlock += '\n' + reqLines[i];
    }
    reqBlock += '\n\nEffective date: ' + document.getElementById('pt-date').value.trim();
    let parts = [reqBlock];
    if (document.getElementById('pt-confirm').classList.contains('active')) parts.push('Sent Confirmation Email (Burned as Source)');
    if (objects) parts.push(objects);
    ptCopy(parts.join('\n\n'));
    ptFlashBtn('pt-doc-btn', 'Copy Documentation');
  };

  window.ptFormatDate = function(el) {
    let v = el.value.replace(/\D/g, '');
    if (v.length >= 5) v = v.slice(0,2) + '/' + v.slice(2,4) + '/' + v.slice(4,8);
    else if (v.length >= 3) v = v.slice(0,2) + '/' + v.slice(2);
    el.value = v;
  };
})();
</script>
</body>
</html>
