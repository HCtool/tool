<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111827;
    --paper: #f3f4f6;
    --panel: #ffffff;
    --line: #e5e7eb;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-soft: #e0e7ff;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --danger-soft: #fee2e2;
    --muted: #6b7280;
    --lrp: #8b5cf6;
    --lrp-hover: #7c3aed;
    --lrp-soft: #ede9fe;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  }
  
  * { 
    box-sizing: border-box; 
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 40px 16px;
  }

  .card {
    width: 100%;
    max-width: 500px;
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    position: relative;
  }

  .tabs {
    display: flex;
    border-bottom: 1px solid var(--line);
    background: #f8fafc;
  }

  .tab-btn {
    flex: 1;
    padding: 16px 8px;
    text-align: center;
    background: none;
    border: none;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s ease;
  }

  .tab-btn:hover { 
    color: var(--ink); 
    background: rgba(0,0,0,0.02);
  }

  .tab-btn.active {
    color: var(--accent);
    border-bottom: 2px solid var(--accent);
    background: var(--panel);
  }

  .tab-content { 
    display: none; 
    padding: 28px 24px; 
    animation: fadeIn 0.3s ease-in-out;
  }

  .tab-content.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .tab-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .tab-header h2 {
    font-size: 18px;
    margin: 0;
    color: var(--ink);
    font-weight: 700;
  }

  .clear-btn {
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .clear-btn:hover {
    background: var(--danger);
    color: #fff;
    transform: translateY(-1px);
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .field { margin-bottom: 20px; }
  
  .row {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 20px;
  }

  .row .field { margin-bottom: 0; flex: 1; }
  .row .side-field { flex: 0 0 120px; }

  input[type="text"],
  input[type="number"],
  input[type="date"],
  select,
  textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: #fff;
    color: var(--ink);
    font-family: inherit;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  input[readonly] {
    background: var(--paper);
    font-weight: 600;
    color: var(--muted);
    border-style: dashed;
    box-shadow: none;
  }

  input.invalid {
    border-color: var(--danger) !important;
    animation: shake 0.4s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  textarea {
    min-height: 120px;
    resize: vertical;
    line-height: 1.5;
  }

  .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 24px 0 16px;
    padding: 20px 0;
    border-top: 1px solid var(--line);
  }

  .pill {
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }

  .pill:hover { 
    border-color: var(--accent); 
    color: var(--accent);
    transform: translateY(-1px);
  }

  .pill.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
  }

  .pill.selected[data-name="Delay03"] {
    background: var(--danger);
    border-color: var(--danger);
    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
  }

  .lrp-row {
    padding: 0 0 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }

  .lrp-btn {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: 2px dashed var(--lrp);
    background: var(--lrp-soft);
    color: var(--lrp);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .lrp-btn:hover {
    background: var(--lrp);
    color: #fff;
  }

  .payment-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    padding: 10px 24px;
  }

  .payment-btn:hover { 
    background: var(--accent-hover); 
    color: #fff;
  }

  .payment-btn#recBtn {
    background: var(--lrp);
    border-color: var(--lrp);
  }

  .payment-btn#recBtn:hover {
    background: var(--lrp-hover);
  }

  .placeholder {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 60px 10px;
    background: var(--paper);
    border-radius: var(--radius-md);
    border: 2px dashed var(--line);
  }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px) scale(0.95);
    background: var(--ink);
    color: #fff;
    padding: 12px 24px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
    box-shadow: var(--shadow-lg);
    text-align: center;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
</style>
</head>
<body>

<div class="card">
  <div class="tabs">
    <button class="tab-btn active" data-tab="call">Call Details</button>
    <button class="tab-btn" data-tab="payment">Payments</button>
    <button class="tab-btn" data-tab="th">T&amp;H Log</button>
  </div>

  <!-- CALL TAB -->
  <div class="tab-content active" id="call">

    <div class="tab-header">
      <h2>My Notes</h2>
      <button class="clear-btn" id="clearBtn">Clear</button>
    </div>

    <div class="row">
      <div class="field">
        <label for="totalBalance">Total Balance ($)</label>
        <input type="text" id="totalBalance" placeholder="0.00" inputmode="decimal">
      </div>
      <div class="side-field">
        <label for="months">Months</label>
        <select id="months">
          <option value="">--</option>
          <option>1</option><option>2</option><option>3</option><option>4</option>
          <option>5</option><option>6</option><option>7</option><option>8</option>
          <option>9</option><option>10</option><option>11</option><option>12</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="monthly">Monthly Due</label>
        <input type="text" id="monthly" placeholder="0.00" readonly>
      </div>
      <div class="side-field">
        <label for="startDate">Start Date</label>
        <input type="date" id="startDate">
      </div>
    </div>

    <div class="pills" id="pillGroup">
      <button class="pill" data-name="VM">VM</button>
      <button class="pill" data-name="No VM">NO VM</button>
      <button class="pill" data-name="Agreed">CONFIRM</button>
      <button class="pill" data-name="Delay03">DEL3</button>
      <button class="pill" data-name="Nil">NIL</button>
      <button class="pill" data-name="Propose">PROPOSAL</button>
    </div>

    <div class="lrp-row">
      <button class="lrp-btn" id="lrpBtn">LRP</button>
    </div>

    <div class="field">
      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="..."></textarea>
    </div>

  </div>

  <!-- PAYMENT TAB -->
  <div class="tab-content" id="payment">

    <div class="tab-header">
      <h2>PD</h2>
      <button class="clear-btn" id="clearPaymentBtn">Clear</button>
    </div>

    <div class="field">
      <label for="paymentNotes">Notes</label>
      <textarea id="paymentNotes" placeholder="..."></textarea>
    </div>

    <div class="row">
      <div class="field">
        <label for="upField">UP</label>
        <input type="text" id="upField" placeholder="00000">
      </div>
      <div class="field">
        <label for="pidField">PID</label>
        <input type="text" id="pidField" placeholder="PID Code">
      </div>
    </div>

    <div class="pills" id="paymentBtnGroup" style="border-top:none; padding-top:0;">
      <button class="pill payment-btn" id="normBtn" data-name="NORM">Normal</button>
      <button class="pill payment-btn" id="recBtn" data-name="REC">Recoup</button>
    </div>

  </div>

  <!-- T&H TAB -->
  <div class="tab-content" id="th">
    <div class="placeholder">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 12px; color: var(--muted);">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg><br>
      T&amp;H tracking modules coming soon.
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  // ---------- Tab switching ----------
  const tabBtns = document.querySelectorAll('.tab-btn');
  const tabContents = document.querySelectorAll('.tab-content');
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  // ---------- Field refs ----------
  const totalBalanceEl = document.getElementById('totalBalance');
  const monthsEl = document.getElementById('months');
  const monthlyEl = document.getElementById('monthly');
  const startDateEl = document.getElementById('startDate');
  const notesEl = document.getElementById('notes');
  const toastEl = document.getElementById('toast');
  const paymentNotesEl = document.getElementById('paymentNotes');
  const upFieldEl = document.getElementById('upField');
  const pidFieldEl = document.getElementById('pidField');

  // ---------- Start Date: always defaults to 10 days from today ----------
  function formatDateInput(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function getDatePlus10() {
    const d = new Date();
    d.setDate(d.getDate() + 10);
    return d;
  }
  function resetStartDate() {
    const plus10 = formatDateInput(getDatePlus10());
    startDateEl.value = plus10;
    startDateEl.min = plus10;
  }
  resetStartDate();

  // ---------- Auto compute Monthly = Total Balance / Months ----------
  function computeMonthly() {
    const total = parseFloat(totalBalanceEl.value);
    const months = parseInt(monthsEl.value, 10);
    if (!isNaN(total) && !isNaN(months) && months > 0) {
      monthlyEl.value = (total / months).toFixed(2);
    } else {
      monthlyEl.value = '';
    }
  }
  totalBalanceEl.addEventListener('input', () => {
    const original = totalBalanceEl.value;
    const cleaned = original.replace(/[^0-9.]/g, '');
    if (cleaned !== original) {
      totalBalanceEl.value = cleaned;
      totalBalanceEl.classList.remove('invalid');
      // restart animation
      void totalBalanceEl.offsetWidth;
      totalBalanceEl.classList.add('invalid');
      clearTimeout(totalBalanceEl._invalidTimer);
      totalBalanceEl._invalidTimer = setTimeout(() => {
        totalBalanceEl.classList.remove('invalid');
      }, 700);
    }
    computeMonthly();
  });
  monthsEl.addEventListener('change', computeMonthly);

  // ---------- Toast ----------
  let toastTimer;
  function showToast(msg) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('Copied to clipboard');
    }).catch(() => {
      showToast('Could not copy — copy manually');
    });
  }

  // ---------- Formatted values for messages ----------
  function getMonthsVal() {
    return monthsEl.value || '[months]';
  }
  function getAmountVal() {
    return monthlyEl.value || '[amount]';
  }
  function getDateVal() {
    if (!startDateEl.value) return '[start date]';
    const d = new Date(startDateEl.value + 'T00:00:00');
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  const TRAILING_SENTENCE = 'Please change to analyst repay once confirmation/payment has been received.';

  const pillMessages = {
    'VM': () => `Unable to reach the agent. Left VM instead. Sent a payment plan proposal email for ${getMonthsVal()} months, amounting to $${getAmountVal()}, and starting on ${getDateVal()}. ${TRAILING_SENTENCE}`,
    'No VM': () => `Unable to reach the agent. Sent a payment plan proposal email for ${getMonthsVal()} months, amounting to $${getAmountVal()}, and starting on ${getDateVal()}. ${TRAILING_SENTENCE}`,
    'Agreed': () => `Reached an agreement of a repayment plan for ${getMonthsVal()} months, amounting to $${getAmountVal()}, and starting on ${getDateVal()}. Sent confirmation email.`,
    'Nil': () => `Repayment plan no longer needed for Outstanding balance is NIL.`,
    'Delay03': () => `Still unable to reach agent after Del3. Changed work item status to CALLCLOSED. sent email follow-up to confirm repay plan for ${getMonthsVal()} months, amounting to $${getAmountVal()}, and starting on ${getDateVal()}. ${TRAILING_SENTENCE}`,
    'Propose': () => `Sent a payment plan proposal email for ${getMonthsVal()} months, amounting to $${getAmountVal()}, and starting on ${getDateVal()}. ${TRAILING_SENTENCE}`
  };

  // ---------- Pills: single-select, click copies message ----------
  let selectedPill = null;
  const pillEls = document.querySelectorAll('.pill');
  pillEls.forEach(pill => {
    pill.addEventListener('click', () => {
      const name = pill.dataset.name;
      pillEls.forEach(p => p.classList.remove('selected'));
      pill.classList.add('selected');
      selectedPill = name;
      const message = pillMessages[name]();
      copyText(message);
    });
  });

  // ---------- LRP button ----------
  document.getElementById('lrpBtn').addEventListener('click', () => {
    if (!selectedPill) {
      showToast('Select a pill first');
      return;
    }
    let message = pillMessages[selectedPill]();
    message = message.replace(' ' + TRAILING_SENTENCE, '').replace(TRAILING_SENTENCE, '').trim();
    copyText(message);
  });

  // ---------- Clear button ----------
  document.getElementById('clearBtn').addEventListener('click', () => {
    totalBalanceEl.value = '';
    totalBalanceEl.classList.remove('invalid');
    monthsEl.value = '';
    monthlyEl.value = '';
    resetStartDate();
    notesEl.value = '';
    pillEls.forEach(p => p.classList.remove('selected'));
    selectedPill = null;
    showToast('Cleared');
  });

  // ---------- Payment tab: NORM / REC ----------
  let lastKnownAmount = '';
  let lastKnownCode = '';

  function getPaymentAmount() {
    // Matches "Amount$150.00", "Amount $150", "amount$ 1,200.5", etc.
    // Captures only the digits/commas/decimal AFTER the $ sign.
    const match = paymentNotesEl.value.match(/Amount\s*\$\s*([\d][\d,]*(?:\.\d{1,2})?)/i);
    if (match) {
      lastKnownAmount = match[1];
    }
    return lastKnownAmount || '[amount]';
  }
  function getApprovalCode() {
    const match = paymentNotesEl.value.match(/Approval code\D{0,15}(\d{5})/i);
    if (match) {
      lastKnownCode = match[1];
    }
    return lastKnownCode || '[approval code]';
  }
  function getTodayMD() {
    const d = new Date();
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  document.getElementById('normBtn').addEventListener('click', () => {
    const message = `card pmt $${getPaymentAmount()} auth ${getApprovalCode()} added ${getTodayMD()} MWF`;
    copyText(message);
  });

  document.getElementById('recBtn').addEventListener('click', () => {
    const up = upFieldEl.value || '[Up]';
    const pid = pidFieldEl.value || '[PID]';
    const message = `card pmt $${getPaymentAmount()} auth ${getApprovalCode()} added ${getTodayMD()} MWF CC recouped to ${up} ${pid}`;
    copyText(message);
  });

  // ---------- Payment tab: Clear button ----------
  document.getElementById('clearPaymentBtn').addEventListener('click', () => {
    paymentNotesEl.value = '';
    upFieldEl.value = '';
    pidFieldEl.value = '';
    lastKnownAmount = '';
    lastKnownCode = '';
    showToast('Cleared');
  });
</script>

</body>
</html>
